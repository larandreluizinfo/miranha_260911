<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leon, Claire & Chris — RPD em 5 locais v6.0</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0d0906;
    font-family:'Segoe UI',Arial,sans-serif; user-select:none; }
  #game { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:crosshair; }
  #hud { position:fixed; top:0; left:0; right:0; display:flex; gap:8px;
    justify-content:center; align-items:center; padding:10px; pointer-events:none;
    z-index:5; flex-wrap:wrap; }
  .pill { background:rgba(10,8,5,.72); border:1px solid rgba(255,150,60,.35);
    color:#ffd9a8; padding:7px 13px; border-radius:999px; font-size:13px;
    font-weight:600; letter-spacing:.5px; backdrop-filter:blur(4px); }
  #hpbar { width:150px; height:10px; background:#3a1512; border-radius:99px;
    overflow:hidden; display:inline-block; vertical-align:middle; margin-left:8px; }
  #hpfill { height:100%; width:100%; background:linear-gradient(90deg,#ff3b30,#ffcc00); transition:width .2s; }
  #bossWrap { position:fixed; top:56px; left:50%; transform:translateX(-50%); width:min(600px,86vw);
    z-index:6; display:none; text-align:center; }
  #bossName { color:#ff8080; font-weight:800; font-size:14px; letter-spacing:1px; text-shadow:0 2px 8px #000; }
  #bossBar { height:12px; background:#2a0d0d; border:1px solid #ff5555; border-radius:99px; overflow:hidden; margin-top:4px; }
  #bossFill { height:100%; width:100%; background:linear-gradient(90deg,#ff0000,#ff8800); transition:width .15s; }
  #overlay { position:fixed; inset:0; display:flex; align-items:center;
    justify-content:center; z-index:10; background:rgba(5,3,2,.74); backdrop-filter:blur(3px); }
  #overlay.hidden { display:none; }
  .card { max-width:660px; width:93%; background:linear-gradient(180deg,#1d130c,#100b07);
    border:1px solid #ff963c55; border-radius:16px; padding:24px; text-align:center;
    color:#ffe6c4; box-shadow:0 20px 80px #000; max-height:92vh; overflow:auto; }
  .card h1 { font-size:26px; margin-bottom:6px; color:#ffb14e; }
  .card h2 { font-size:21px; margin-bottom:6px; color:#ffb14e; }
  .card p { font-size:14px; line-height:1.5; color:#e8c9a0; margin:7px 0; }
  .leon-badge { display:inline-block; background:#1c3a5e; border:1px solid #6ea8ff;
    color:#cfe4ff; padding:6px 14px; border-radius:999px; font-size:13px; font-weight:700; margin-bottom:6px; }
  .keys { display:inline-block; text-align:left; margin:8px auto; font-size:13px;
    background:#00000055; padding:10px 14px; border-radius:10px; border:1px solid #ffffff18; }
  .keys b { color:#ffd166; }
  button { margin-top:12px; background:linear-gradient(180deg,#ff9a3c,#e0621a);
    border:none; color:#1d0e04; font-weight:800; font-size:16px; padding:12px 30px;
    border-radius:999px; cursor:pointer; letter-spacing:.5px; }
  button:hover { filter:brightness(1.12); }
  button:disabled { filter:grayscale(1); opacity:.5; cursor:default; }
  .diffRow { display:flex; gap:8px; justify-content:center; margin:10px 0; flex-wrap:wrap; }
  .diffBtn { padding:9px 16px; font-size:13px; border-radius:999px; margin-top:0;
    background:#222; color:#ccc; border:2px solid #444; }
  .diffBtn.sel-facil { border-color:#5dd35d; color:#c8ffc8; background:#123212; }
  .diffBtn.sel-normal { border-color:#6ea8ff; color:#d4e6ff; background:#16294d; }
  .diffBtn.sel-dificil { border-color:#ff9a3c; color:#ffe0b8; background:#4d2a10; }
  .diffBtn.sel-impossivel { border-color:#ff3b30; color:#ffc4c4; background:#4d1010; }
  .shopGrid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0; }
  @media (max-width:560px){ .shopGrid{ grid-template-columns:1fr; } }
  .item { background:#00000066; border:1px solid #ff963c44; border-radius:12px; padding:10px; text-align:left; }
  .item b { color:#ffd166; font-size:14px; }
  .item small { color:#c9a87f; display:block; margin:3px 0 6px; font-size:12px; }
  .buyBtn { padding:7px 14px; font-size:13px; margin-top:4px; }
  #coinsBig { font-size:20px; color:#ffe27a; font-weight:800; }
  #toast { position:fixed; top:64px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.75); color:#ffd166; padding:10px 22px; border-radius:999px;
    font-weight:700; z-index:6; display:none; border:1px solid #ffd16655; white-space:nowrap; max-width:94vw; overflow:hidden; text-overflow:ellipsis; }
  #dmgflash { position:fixed; inset:0; pointer-events:none; z-index:7; opacity:0;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(255,0,0,.55) 100%); }
  #musicBtn { position:fixed; bottom:16px; right:16px; z-index:8;
    background:rgba(10,8,5,.8); border:1px solid #4ecdc4; color:#a8fff8;
    padding:10px 16px; border-radius:999px; font-size:13px; font-weight:700; cursor:pointer; }
  #musicBtn.off { border-color:#666; color:#999; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="pill">FASE <span id="hFase">–</span>/25</div>
  <div class="pill">DIF <span id="hDiff">NORMAL</span></div>
  <div class="pill">ZUMBIS <span id="hZomb">–</span></div>
  <div class="pill">ABATES <span id="hKills">0</span></div>
  <div class="pill">🪙 <span id="hCoins">0</span></div>
  <div class="pill">VIDA <span id="hpbar"><span id="hpfill"></span></span></div>
  <div class="pill">ARMA <span id="hArma">PISTOLA</span></div>
  <div class="pill">HERÓI <span id="hHero">LEON RE2</span></div>
</div>
<div id="bossWrap"><div id="bossName">BOSS</div><div id="bossBar"><div id="bossFill"></div></div></div>
<div id="toast"></div>
<div id="dmgflash"></div>
<button id="musicBtn">♪ SURF MUSIC: ON</button>
<div id="overlay"><div class="card" id="cardMenu"></div></div>
<script>
(() => {
"use strict";
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const hFase = document.getElementById('hFase');
const hDiff = document.getElementById('hDiff');
const hZomb = document.getElementById('hZomb');
const hKills = document.getElementById('hKills');
const hCoins = document.getElementById('hCoins');
const hpfill = document.getElementById('hpfill');
const hArma = document.getElementById('hArma');
const hHero = document.getElementById('hHero');
const overlay = document.getElementById('overlay');
const cardMenu = document.getElementById('cardMenu');
const toast = document.getElementById('toast');
const dmgflash = document.getElementById('dmgflash');
const musicBtn = document.getElementById('musicBtn');
const bossWrap = document.getElementById('bossWrap');
const bossName = document.getElementById('bossName');
const bossFill = document.getElementById('bossFill');

let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(window.devicePixelRatio||1,2); W=window.innerWidth; H=window.innerHeight;
  canvas.width=Math.floor(W*DPR); canvas.height=Math.floor(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener('resize',resize); resize();
const groundY = () => H*0.82;
const TOTAL = 25;

// ---------- DIFICULDADES ----------
const DIFFS = {
  facil:      { nome:'FÁCIL',      multHp:0.65, multDmg:0.6,  multSpeed:0.9,  maxAliveBonus:0, coinBonus:1.2 },
  normal:     { nome:'NORMAL',     multHp:1.0,  multDmg:1.0,  multSpeed:1.0,  maxAliveBonus:0, coinBonus:1.0 },
  dificil:    { nome:'DIFÍCIL',    multHp:1.35, multDmg:1.45, multSpeed:1.06, maxAliveBonus:1, coinBonus:1.3 },
  impossivel: { nome:'IMPOSSÍVEL', multHp:1.9,  multDmg:2.1,  multSpeed:1.14, maxAliveBonus:2, coinBonus:1.6 },
};
let diffKey = 'normal';
const diff = () => DIFFS[diffKey];

// ---------- FASES 1-25 (boss a cada 5) ----------
function genPhase(n) {
  const isBoss = n % 5 === 0;
  const total = isBoss ? Math.min(10 + n, 30) : Math.min(6 + n*2, 38);
  const interval = Math.max(0.32, 1.5 - n*0.045);
  const maxAlive = Math.min(4 + Math.floor(n/2), 11) + diff().maxAliveBonus;
  let pool;
  if (n <= 3) pool = ['normal','normal','normal'];
  else if (n <= 7) pool = ['normal','normal','runner'];
  else if (n <= 12) pool = ['normal','runner','runner'];
  else if (n <= 18) pool = ['normal','runner','brute'];
  else pool = ['runner','brute','brute','normal'];
  return { total, interval, maxAlive, pool, isBoss };
}
const BOSS_DEFS = [
  { nome:'ESPANTALHO MUTANTE',   hp:50,  speed:58, dmg:22, h:120, cor:'#8f7a3a', esc:'#4a3d15', camisa:'#5a4a20' },
  { nome:'FAZENDEIRO DA SERRA',  hp:90,  speed:62, dmg:28, h:130, cor:'#9a5a4a', esc:'#4a241c', camisa:'#3d2f26' },
  { nome:'BOI DEMONÍACO',        hp:135, speed:70, dmg:32, h:140, cor:'#6a4a5a', esc:'#33202a', camisa:'#2c1a24' },
  { nome:'CEIFADOR DO MILHARAL', hp:185, speed:76, dmg:38, h:150, cor:'#5a7a4a', esc:'#24331c', camisa:'#1c2a15' },
  { nome:'REI ZUMBI DA FAZENDA', hp:260, speed:82, dmg:45, h:165, cor:'#7a2a2a', esc:'#3d1010', camisa:'#2a0d0d' },
];
const ZSTATS = {
  normal: { hp:3, speed:70,  dmg:10, h:72,  cor:'#7da05a', esc:'#3d5527', camisa:'#4a5a3a', coins:10 },
  runner: { hp:2, speed:165, dmg:8,  h:66,  cor:'#b8c44a', esc:'#5d6620', camisa:'#6b6b2e', coins:12 },
  brute:  { hp:11,speed:48,  dmg:22, h:102, cor:'#8a6f5c', esc:'#4a382c', camisa:'#3d2f26', coins:25 },
};
const GRAV = 2100, JUMP_V = 780;

// ---------- AUDIO ----------
let AC=null;
function audio(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume(); return AC; }
function beep(freq,dur,type,vol){ try{ const ac=audio(); const o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'square'; o.frequency.value=freq; g.gain.value=vol||0.06; o.connect(g); g.connect(ac.destination);
  o.start(); g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+(dur||0.08)); o.stop(ac.currentTime+(dur||0.08)); }catch(e){} }
const sfxShoot=()=>beep(700+Math.random()*300,0.07,'square',0.05);
const sfxKnife=()=>beep(220,0.1,'sawtooth',0.07);
const sfxHit=()=>beep(140,0.1,'sawtooth',0.08);
const sfxDie=()=>beep(90,0.25,'sawtooth',0.09);
const sfxHurt=()=>beep(180,0.2,'square',0.09);
const sfxCoin=()=>{beep(950,0.07,'square',0.05); setTimeout(()=>beep(1400,0.09,'square',0.05),70);};
const sfxBuy=()=>{beep(600,0.1,'sine',0.08); setTimeout(()=>beep(900,0.12,'sine',0.08),100);};
const sfxBoss=()=>{beep(70,0.5,'sawtooth',0.12); setTimeout(()=>beep(55,0.6,'sawtooth',0.12),250);};

// música surf
let musicOn=true,musicTimer=null,step=0,nextTime=0,musicBus=null;
const BPM=168,SPB=60/BPM/2;
const BASSLINE=[82.4,82.4,82.4,82.4,82.4,82.4,110,110,82.4,82.4,98,98,123.5,123.5,98,98];
const LEAD=[659,0,659,784,0,659,0,494,587,0,587,659,0,587,494,0,659,0,659,784,880,784,659,587,494,0,587,659,587,494,82.4,0];
function initMusicBus(){ const ac=audio(); if(musicBus)return; musicBus=ac.createGain(); musicBus.gain.value=0.5;
  const delay=ac.createDelay(1); delay.delayTime.value=0.23; const fb=ac.createGain(); fb.gain.value=0.32;
  const wet=ac.createGain(); wet.gain.value=0.35; delay.connect(fb); fb.connect(delay); delay.connect(wet);
  wet.connect(ac.destination); musicBus.connect(ac.destination); musicBus.connect(delay); }
function noiseBurst(t,dur,vol,freq){ const ac=audio(); const len=Math.floor(ac.sampleRate*dur);
  const buf=ac.createBuffer(1,len,ac.sampleRate); const d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const src=ac.createBufferSource(); src.buffer=buf; const f=ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=freq||1000;
  const g=ac.createGain(); g.gain.value=vol; src.connect(f); f.connect(g); g.connect(musicBus); src.start(t); }
function playNote(t,freq,dur,type,vol){ if(!freq)return; const ac=audio(); const o=ac.createOscillator(),g=ac.createGain();
  o.type=type; o.frequency.value=freq; const lfo=ac.createOscillator(); lfo.frequency.value=6;
  const lg=ac.createGain(); lg.gain.value=6; lfo.connect(lg); lg.connect(o.frequency);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(musicBus); o.start(t); o.stop(t+dur+0.02); lfo.start(t); lfo.stop(t+dur+0.02); }
function scheduleStep(s,t){ const i=s%16,pos=s%4;
  if(pos===0||pos===2){ const ac=audio(); const o=ac.createOscillator(),g=ac.createGain();
    o.type='sine'; o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(40,t+0.12);
    g.gain.setValueAtTime(0.5,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.14);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t+0.16); }
  if(pos===1||pos===3)noiseBurst(t,0.12,0.35,1800);
  noiseBurst(t,0.03,0.08,6000);
  playNote(t,BASSLINE[i],0.22,'triangle',0.28);
  if(s%2===0)playNote(t,BASSLINE[i]*2,0.1,'square',0.06);
  playNote(t,LEAD[s%LEAD.length],0.21,'square',0.11); }
function scheduler(){ if(!musicOn)return; const ac=audio();
  while(nextTime<ac.currentTime+0.25){ scheduleStep(step,nextTime); nextTime+=SPB; step++; } }
function startMusic(){ try{ initMusicBus(); audio(); if(musicTimer)clearInterval(musicTimer);
  step=0; nextTime=audio().currentTime+0.1; musicTimer=setInterval(scheduler,80);
  musicBtn.textContent='♪ SURF MUSIC: ON'; musicBtn.classList.remove('off'); }catch(e){} }
function stopMusic(){ if(musicTimer)clearInterval(musicTimer); musicTimer=null;
  musicBtn.textContent='♪ SURF MUSIC: OFF'; musicBtn.classList.add('off'); }
function toggleMusic(){ musicOn=!musicOn; if(musicOn)startMusic(); else stopMusic(); }
musicBtn.onclick=toggleMusic;

// ---------- ESTADO ----------
let state='menu', player, bullets, zombies, parts, embers;
let fase=0, spawned=0, kills=0, killsFase=0, bossSpawned=false, activeBoss=null;
let spawnTimer=0, elapsed=0;
let mouse={x:innerWidth*0.7,y:innerHeight*0.4,down:false};
let keys={};
let shootCd=0, knifeCd=0, knifeTimer=0, walkPhase=0, clearTimer=0;

function resetPlayer(){
  player={ x:W/2, y:groundY(), vy:0, hp:100, maxHp:100, speed:340, face:1, aim:0,
    weapon:'pistol', gun:'pistol', owned:{pistol:true,shotgun:false,smg:false},
    muzzle:0, onGround:true, moving:false, coins:0,
    hero:'leon', uni:'re2', unif:UNIFORMES[0],
    up:{ dPist:0, dFaca:0, armor:0, spd:0, hpBonus:0 } };
}
const pistolDmg=()=>1+player.up.dPist;
const knifeDmg=()=>3+player.up.dFaca;
const armorRed=()=>Math.min(0.6,player.up.armor*0.12);
const GUNNOME={pistol:'PISTOLA',shotgun:'ESPINGARDA',smg:'SUBMETRALHADORA'};
// ---------- PERSONAGENS + ROUPAS (RPD de RE2/3/4/6/9) ----------
const HEROIS = {
  leon:{ nome:'LEON', full:'LEON S. KENNEDY',
    cores:{ camisa:'#24466e', camisa2:'#2f5a8a', colete:'#101318', calca:'#1b2639', calca2:'#182032',
            bota:'#17100a', pele:'#e8b88a', cabelo:'#3a2a1c', texto:'POLICE', crachá:'#c9a227' },
    arma:'pistol', armaNome:'PISTOLA', mus:'RPD' },
  claire:{ nome:'CLAIRE', full:'CLAIRE REDFIELD',
    cores:{ camisa:'#c8332f', camisa2:'#e04a44', colete:'#2b2f36', calca:'#2e3d55', calca2:'#223048',
            bota:'#17100a', pele:'#f0c49a', cabelo:'#a8571f', texto:'S.T.A.R.S.', crachá:'#d8d2c4' },
    arma:'pistol', armaNome:'PISTOLA', mus:'S.T.A.R.S.' },
  chris:{ nome:'CHRIS', full:'CHRIS REDFIELD',
    cores:{ camisa:'#1f3f7a', camisa2:'#2a549b', colete:'#141a22', calca:'#1f3049', calca2:'#182234',
            bota:'#17100a', pele:'#dca87c', cabelo:'#241a12', texto:'U.S.S. ACE', crachá:'#c9a227' },
    arma:'shotgun', armaNome:'ESPINGARDA', mus:'U.S.S.' },
};
// 5 uniformes do Leon, um por jogo
const UNIFORMES = [
  { id:'re2', jogo:'RE2', nome:'POLICIA NORMAL',  desc:'Azul marinho com colete tático (Raccoon City)',
    camisa:'#24466e', camisa2:'#2f5a8a', colete:'#101318', calca:'#1b2639', calca2:'#182032', texto:'POLICE' },
  { id:'re3', jogo:'RE3', nome:'TÁTICA PRETA',   desc:'Pretão tático com colete e capuz (falta de luz)',
    camisa:'#20242b', camisa2:'#2e343d', colete:'#0e1013', calca:'#191d24', calca2:'#13161b', texto:'BSAA' },
  { id:'re4', jogo:'RE4', nome:'JAQUETA DE COURO',desc:'Jaqueta marrom com camisa cinza (cavalo de Resident Evil)',
    camisa:'#5d3f27', camisa2:'#6f4f32', colete:'#3f2a18', calca:'#3d3a36', calca2:'#2e2c28', texto:'R.P.D.' },
  { id:'re6', jogo:'RE6', nome:'BIO-HAZZARD',   desc:'Traje tático azul-escuro da Bio-Hazard (jogo de 6)',
    camisa:'#16283d', camisa2:'#1e3a58', colete:'#0d141c', calca:'#141d29', calca2:'#0e1520', texto:'B-H' },
  { id:'re9', jogo:'RE9', nome:'FANTASIA INVIÁVEL',desc:'Terno escuro com camisa social e gravata (jogo de 9)',
    camisa:'#25262b', camisa2:'#33353c', colete:'#191a1f', calca:'#1c1d22', calca2:'#141519', texto:'TERROR' },
];
const ownedList=()=>['pistol','shotgun','smg'].filter(g=>player.owned[g]).map(g=>GUNNOME[g]).join(' • ');
function selectGun(g){
  if(!player)return;
  if(!player.owned[g]){ if(state==='playing'){ showToast('Compre a '+GUNNOME[g]+' no mercador! 🛒',1600); beep(150,0.15,'square',0.07); } return; }
  player.gun=g;
  if(player.weapon!=='knife')player.weapon=g;
  beep(500,0.06,'square',0.05); updateHUD();
}
function cycleGun(){
  const order=['pistol','shotgun','smg'].filter(g=>player.owned[g]);
  if(order.length<2){ showToast('Compre novas armas no mercador! 🛒',1600); return; }
  selectGun(order[(order.indexOf(player.gun)+1)%order.length]);
}

function startGame(){
  resetPlayer(); bullets=[]; zombies=[]; parts=[]; embers=[];
  for(let i=0;i<70;i++)embers.push({x:Math.random()*W,y:Math.random()*H,s:1+Math.random()*2.5,v:12+Math.random()*30,o:Math.random()*7});
  fase=0; kills=0; elapsed=0; bossSpawned=false; activeBoss=null;
  overlay.classList.add('hidden'); bossWrap.style.display='none';
  if(musicOn)startMusic();
  startPhase(1);
}
function startPhase(n){
  fase=n; spawned=0; killsFase=0; zombies=[]; bullets=[]; bossSpawned=false; activeBoss=null;
  bossWrap.style.display='none';
  spawnTimer=0.6;
  if(n>1){ player.hp=Math.min(player.maxHp,player.hp+30); }
  // dificuldade sobe levemente por nível (mesmo no fácil)
  state='playing';
  const cfg=genPhase(n);
  if(cfg.isBoss){ showToast('☠ FASE '+n+' — BOSS: '+BOSS_DEFS[n/5-1].nome+'!',3200); sfxBoss(); }
  else showToast('FASE '+n+'/25 ['+diff().nome+'] • '+localName()+' — '+cfg.total+' zumbis!',2800);
  updateHUD();
}
function showToast(msg,ms){ toast.textContent=msg; toast.style.display='block';
  clearTimeout(showToast._t); showToast._t=setTimeout(()=>toast.style.display='none',ms||2600); }
function endCard(titulo,texto,btn){
  cardMenu.innerHTML='<div class="leon-badge">★ LEON ★</div><h2>'+titulo+'</h2><p>'+texto+'</p>'+
    '<button id="btnAgain">'+btn+'</button><p style="font-size:13px">ou pressione R • dificuldade: '+diff().nome+'</p>';
  overlay.classList.remove('hidden');
  document.getElementById('btnAgain').onclick=startGame;
}

// ---------- MENU + DIFICULDADE ----------
function showMenu(){
  state='menu';
  const btns = Object.keys(DIFFS).map(k=>
    '<button class="diffBtn '+(k===diffKey?'sel-'+k:'')+'" data-d="'+k+'">'+DIFFS[k].nome+'</button>').join('');
  cardMenu.innerHTML =
    '<div class="leon-badge">★ LEON POLICIAL — 25 FASES • v4.0 ★</div>'+
    '<h1>FAZENDA APOCALÍPTICA</h1>'+
    '<p><b>25 fases</b>! Boss a cada 5 fases. <b>Mercador no fim de toda fase</b> com 💥 Espingarda e 🔥 Submetralhadora!</p>'+

function priceOf(it){
  const lvl = it.id==='hp'?player.up.hpBonus/25 : it.id==='pist'?player.up.dPist : it.id==='faca'?player.up.dFaca
    : it.id==='cole'?player.up.armor : it.id==='bota'?player.up.spd : 0;
  if(it.id==='cura') return 60 + fase*2;
  if(it.id==='shot'||it.id==='smg'||it.id==='claire'||it.id==='chris'
     ||it.id==='uni3'||it.id==='uni4'||it.id==='uni6'||it.id==='uni9') return it.base;
  return Math.floor(it.base * (1 + lvl*0.6));
}

function buy(id){
  const it=SHOP.find(i=>i.id===id); const p=priceOf(it);
  if(player.coins<p){ beep(150,0.2,'square',0.08); return; }
  player.coins-=p; sfxBuy();
  if(id==='hp'){ player.up.hpBonus+=25; player.maxHp+=25; player.hp=Math.min(player.maxHp,player.hp+25); }
  if(id==='pist') player.up.dPist+=1;
  if(id==='faca') player.up.dFaca+=1;
  if(id==='cole'){ if(player.up.armor>=5){ player.coins+=p; showToast('Colete no máximo!',1500); renderShop(); updateHUD(); return; } player.up.armor+=1; }
  if(id==='bota'){ player.up.spd+=1; player.speed+=15; }
  if(id==='cura'){ player.hp=player.maxHp; }
  if(id==='shot'){ if(player.owned.shotgun)return; player.owned.shotgun=true; player.gun='shotgun'; if(player.weapon!=='knife')player.weapon='shotgun'; }
  if(id==='smg'){ if(player.owned.smg)return; player.owned.smg=true; player.gun='smg'; if(player.weapon!=='knife')player.weapon='smg'; }
  if(id==='claire'){ player.hero='claire'; player.speed+=25; player.up.dFaca+=1; }
  if(id==='chris'){ player.hero='chris'; player.maxHp+=40; player.hp=Math.min(player.maxHp,player.hp+40);
    player.up.dPist+=2; player.owned.shotgun=true; player.gun='shotgun'; if(player.weapon!=='knife')player.weapon='shotgun'; }
  if(id==='uni3'||id==='uni4'||id==='uni6'||id==='uni9'){
    const u=UNIFORMES.find(x=>x.id===id.replace('uni','re'));
    if(u){ player.uni=u.id; player.unif=u; }
  }
  showToast('Comprou: '+it.nome,1500);
  renderShop(); updateHUD();
}

// ---------- SPAWN ----------
function spawnZombie(){
  const cfg=genPhase(fase); const D=diff();
  // boss entra no meio da fase (depois de metade dos comuns)
  if(cfg.isBoss && !bossSpawned && spawned>=Math.floor(cfg.total/2)){
    const bi=fase/5-1, b=BOSS_DEFS[bi];
    const x=Math.random()<0.5?-60:W+60;
    const z={ x, y:groundY(), tipo:'boss', bossIdx:bi, nome:b.nome,
      hp:Math.floor(b.hp*D.multHp*(1+fase*0.012)), dmg:Math.floor(b.dmg*D.multDmg),
      speed:b.speed*D.multSpeed, h:b.h, cor:b.cor, esc:b.esc, camisa:b.camisa,
      hitCd:0, wob:0, wobV:5, chargeCd:3, charging:0, maxHp:0 };
    z.maxHp=z.hp; zombies.push(z); bossSpawned=true; activeBoss=z; spawned++;
    sfxBoss(); showToast('☠ '+b.nome+' CHEGOU!',2500); updateHUD();
    return;
  }
  const tipo=cfg.pool[Math.floor(Math.random()*cfg.pool.length)];
  const st=ZSTATS[tipo];
  const x=Math.random()<0.5?-40:W+40;
  const hpBonus=Math.floor(fase/5);
  zombies.push({ x, y:groundY(), tipo, hp:Math.floor((st.hp+hpBonus)*D.multHp)||1,
    maxHp:Math.floor((st.hp+hpBonus)*D.multHp)||1,
    speed:st.speed*D.multSpeed*(0.85+Math.random()*0.35)+fase*2,
    h:st.h, dmg:Math.max(1,Math.floor(st.dmg*D.multDmg*(1+fase*0.008))),
    hitCd:0, wob:Math.random()*10, wobV:6+Math.random()*4 });
  spawned++;
}
function updateHUD(){
  hFase.textContent=fase||'–'; hDiff.textContent=diff().nome;
  const cfg=genPhase(fase||1);
  const restantes=cfg.total-killsFase;
  hZomb.textContent=state==='playing'?(restantes+' esq.'+(cfg.isBoss?' ☠':'')):'–';
  hKills.textContent=kills; hCoins.textContent=player?player.coins:0;
  hpfill.style.width=Math.max(0,player?player.hp/player.maxHp*100:0)+'%';
  if(player)hArma.textContent=player.weapon==='knife'?'FACA!':(GUNNOME[player.gun]||'PISTOLA');
  if(player)hHero.textContent=player.hero==='leon'?('LEON '+player.unif.jogo)
    :(player.hero==='claire'?'CLAIRE S.T.A.R.S.':'CHRIS U.S.S.');
  if(activeBoss&&!activeBoss.morto){ bossWrap.style.display='block';
    bossName.textContent='☠ '+activeBoss.nome+' ☠';
    bossFill.style.width=Math.max(0,activeBoss.hp/activeBoss.maxHp*100)+'%';
  } else bossWrap.style.display='none';
}

// ---------- COMBATE ----------
function shoulderPos(){ return { x:player.x, y:player.y-62 }; }
function shoot(){
  const s=shoulderPos(), a=player.aim, gun=player.gun;
  const gx=s.x+Math.cos(a)*34, gy=s.y+Math.sin(a)*34;
  if(gun==='shotgun'){ // 💥 tiro quíntuplo espalhado
    for(let i=0;i<5;i++){
      const sp=a+(Math.random()-0.5)*0.38;
      bullets.push({x:gx,y:gy,vx:Math.cos(sp)*760,vy:Math.sin(sp)*760,life:0.55,r:4,dmg:1+Math.floor(player.up.dPist/2)});
    }
    shootCd=0.75;
  } else if(gun==='smg'){ // 🔥 rajada rápida
    const sp=a+(Math.random()-0.5)*0.1;
    bullets.push({x:gx,y:gy,vx:Math.cos(sp)*900,vy:Math.sin(sp)*900,life:1.0,r:4,dmg:pistolDmg()});
    shootCd=0.1;
  } else { // pistola
    bullets.push({x:gx,y:gy,vx:Math.cos(a)*820,vy:Math.sin(a)*820,life:1.2,r:4,dmg:pistolDmg()});
    shootCd=0.21;
  }
  sfxShoot(); player.muzzle=0.06;
  for(let i=0;i<4;i++)parts.push({x:gx,y:gy,vx:(Math.random()-.5)*160,vy:(Math.random()-.5)*160,life:.25,max:.25,cor:'#ffcf6e',r:2});
}
function knife(){
  if(knifeCd>0||state!=='playing')return;
  knifeCd=0.5; knifeTimer=0.30; player.weapon='knife'; sfxKnife(); updateHUD();
  for(const z of zombies){
    const dx=(z.x-player.x)*player.face, zy=z.y-(z.h||70)/2;
    const dy=Math.abs(zy-(player.y-50));
    const range = z.tipo==='boss'?130:105;
    if(dx>-10&&dx<range&&dy<80){ z.hp-=knifeDmg(); sangue(z.x,z.y-(z.h||70)/2,10);
      if(z.hp<=0)matar(z); else sfxHit(); }
  }
  const s=shoulderPos();
  for(let i=0;i<8;i++)parts.push({x:s.x+player.face*40,y:s.y+(Math.random()-.5)*20,
    vx:player.face*(120+Math.random()*160),vy:(Math.random()-.5)*160,life:.2,max:.2,cor:'#fff',r:2});
}
function sangue(x,y,n){ for(let i=0;i<(n||8);i++){ const a=Math.random()*Math.PI*2,v=60+Math.random()*220;
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,life:.5,max:.5,cor:Math.random()<.5?'#8fbf4d':'#4c6b2a',r:2+Math.random()*3}); } }
function matar(z){
  z.morto=true; kills++; killsFase++;
  let gain = z.tipo==='boss'?200:(ZSTATS[z.tipo]?ZSTATS[z.tipo].coins:10);
  gain=Math.floor(gain*diff().coinBonus);
  player.coins+=gain; sfxDie();
  if(z.tipo==='boss'){ showToast('BOSS DERROTADO! +'+gain+' 🪙',2600); activeBoss=null; beep(800,0.2,'sine',0.1); }
  else if(Math.random()<0.4) sfxCoin();
  sangue(z.x,z.y-(z.h||70)/2,14); updateHUD();
}

// ---------- UPDATE ----------
function update(dt){
  elapsed+=dt; shootCd-=dt; knifeCd-=dt;
  if(player.muzzle>0)player.muzzle-=dt;
  if(knifeTimer>0){ knifeTimer-=dt; if(knifeTimer<=0){ player.weapon=player.gun; updateHUD(); } }
  let mx=0;
  if(keys['a']||keys['arrowleft'])mx-=1;
  if(keys['d']||keys['arrowright'])mx+=1;
  player.moving=!!mx;
  player.x=Math.max(24,Math.min(W-24,player.x+mx*player.speed*dt));
  if(mx!==0)walkPhase+=dt*11;
  if((keys['w']||keys['arrowup']||keys[' '])&&player.onGround){ player.vy=-JUMP_V; player.onGround=false; }
  player.vy+=GRAV*dt; player.y+=player.vy*dt;
  if(player.y>=groundY()){ player.y=groundY(); player.vy=0; player.onGround=true; }
  const s=shoulderPos();
  player.aim=Math.atan2(mouse.y-s.y,mouse.x-s.x);
  player.face=(mouse.x>=player.x)?1:-1;
  if(mx!==0&&Math.abs(mouse.x-player.x)<30)player.face=mx;
  const wantFire=mouse.down||keys['p']||keys['l']||keys[' ']||
    keys['arrowup']||keys['arrowdown']||keys['arrowleft']||keys['arrowright'];
  if(wantFire&&shootCd<=0&&state==='playing'&&player.weapon!=='knife'){ shoot(); }

  const cfg=genPhase(fase);
  if(state==='playing'){
    spawnTimer-=dt;
    if(spawned<cfg.total&&spawnTimer<=0&&zombies.length<cfg.maxAlive){ spawnZombie(); spawnTimer=cfg.interval; }
    if(spawned>=cfg.total&&zombies.length===0){
      if(fase>=TOTAL){ state='victory';
        endCard('VITÓRIA! 🏆','Leon zerou as 25 fases ['+diff().nome+'] com '+kills+' abates e 🪙'+player.coins+'!','JOGAR DE NOVO'); }
      else { openMerchant(); } // mercador no fim de TODA fase
      updateHUD();
    }
  }
  if(state==='phaseclear'){ clearTimer-=dt; if(clearTimer<=0)startPhase(fase+1); }

  for(let i=bullets.length-1;i>=0;i--){ const b=bullets[i];
    b.vy+=300*dt; b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    if(b.life<=0||b.x<-30||b.x>W+30||b.y>groundY()+10){ bullets.splice(i,1); continue; }
    for(const z of zombies){ if(z.morto)continue;
      const d=Math.hypot(z.x-b.x,(z.y-(z.h||70)/2)-b.y);
      const rr=(z.tipo==='boss'?38:(z.tipo==='brute'?28:20))+b.r;
      if(d<rr){ z.hp-=(b.dmg||1); sangue(b.x,b.y,5); bullets.splice(i,1);
        if(z.hp<=0)matar(z); else sfxHit(); break; } }
  }
  zombies=zombies.filter(z=>!z.morto);
  for(const z of zombies){
    z.hitCd-=dt; z.wob+=dt*z.wobV;
    const dir=Math.sign(player.x-z.x)||1;
    let sp=z.speed;
    // boss investida
    if(z.tipo==='boss'){
      z.chargeCd-=dt;
      if(z.charging>0){ z.charging-=dt; sp=z.speed*3.1; }
      else if(z.chargeCd<=0&&Math.abs(player.x-z.x)>220){ z.charging=0.8; z.chargeCd=4; sfxBoss();
        for(let i=0;i<10;i++)parts.push({x:z.x,y:z.y-20,vx:(Math.random()-.5)*200,vy:-Math.random()*200,life:.4,max:.4,cor:'#ff5b5b',r:3}); }
    }
    z.x+=dir*sp*dt;
    let zy=groundY();
    if(z.tipo==='runner')zy-=Math.abs(Math.sin(z.wob*1.6))*8;
    if(z.tipo==='boss'&&z.charging>0)zy-=4;
    z.y+=(zy-z.y)*Math.min(1,dt*10);
    const dx=Math.abs(player.x-z.x);
    const reach=z.tipo==='boss'?52:34;
    if(dx<reach&&Math.abs(player.y-z.y)<110&&z.hitCd<=0&&state==='playing'){
      z.hitCd=z.tipo==='boss'?0.7:0.9;
      const real=Math.max(1,Math.floor(z.dmg*(1-armorRed())));
      player.hp-=real; sfxHurt();
      dmgflash.style.opacity=1; setTimeout(()=>dmgflash.style.opacity=0,180);
      sangue(player.x,player.y-50,8); updateHUD();
      if(player.hp<=0){ player.hp=0; state='gameover'; updateHUD();
        endCard('VOCÊ MORREU ☠','Leon caiu na fase '+fase+'/25 ['+diff().nome+'] com '+kills+' abates e 🪙'+player.coins+'.','TENTAR DE NOVO'); }
    }
  }
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i];
    p.vy+=600*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.98; p.life-=dt;
    if(p.life<=0||p.y>groundY()+6)parts.splice(i,1); }
  for(const e of embers){ e.y-=e.v*dt; e.x+=Math.sin(elapsed+e.o)*20*dt;
    if(e.y<-10){ e.y=H+10; e.x=Math.random()*W; } }
  updateHUD();
}

// ============ CENÁRIO 1: FAZENDA APOCALÍPTICA ============
function drawFazendaScene(t){
  const gy=groundY();
  // fase mais alta = céu mais vermelho e ameaçador
  const f=fase/TOTAL;
  const ceu=ctx.createLinearGradient(0,0,0,gy);
  ceu.addColorStop(0,'#060509'); ceu.addColorStop(0.35,'#241221');
  ceu.addColorStop(0.62,f>0.6?'#6e2418':'#572b15'); ceu.addColorStop(0.85,f>0.6?'#b0401c':'#96521e');
  ceu.addColorStop(1,'#cf7f30');
  ctx.fillStyle=ceu; ctx.fillRect(0,0,W,gy+2);
  // estrelas sumindo no topo
  for(let i=0;i<36;i++){ const tx2=(i*197.3)%W, ty2=(i*89.7)%(H*0.16);
    ctx.globalAlpha=0.15+0.2*Math.abs(Math.sin(t*1.5+i)); ctx.fillStyle='#fff'; ctx.fillRect(tx2,ty2,2,2); }
  ctx.globalAlpha=1;
  // sol baixo no horizonte
  const sx=W*0.7,sy=gy-150;
  const glow=ctx.createRadialGradient(sx,sy,10,sx,sy,190);
  glow.addColorStop(0,'rgba(255,210,140,.95)'); glow.addColorStop(0.4,'rgba(255,140,60,.45)'); glow.addColorStop(1,'rgba(255,120,40,0)');
  ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(sx,sy,190,0,7); ctx.fill();
  ctx.fillStyle='rgba(255,160,80,.5)'; ctx.beginPath(); ctx.arc(sx,sy,46,0,7); ctx.fill();
  ctx.fillStyle='#ffe3b0'; ctx.beginPath(); ctx.arc(sx,sy,36,0,7); ctx.fill();
  // nuvens iluminadas por baixo, em movimento
  for(let i=0;i<7;i++){ const cx=((i*W/6)+t*14*(1+i*0.15))%(W+340)-170;

  // árvores mortas na frente

    ctx.beginPath(); ctx.moveTo(x,gy); ctx.quadraticCurveTo(x-5*s,gy-40*s,x+6*s,gy-80*s); ctx.stroke();

    ctx.beginPath(); ctx.moveTo(x+3*s,gy-52*s); ctx.quadraticCurveTo(x-20*s,gy-72*s,x-28*s,gy-100*s); ctx.stroke();

  arvoreM(W*0.90,1); arvoreM(W*0.035,0.7);
  // asfalto
  const chao=ctx.createLinearGradient(0,gy,0,H);

  ctx.fillStyle=chao; ctx.fillRect(0,gy,W,H-gy);
  ctx.fillStyle='rgba(255,255,255,.08)'; ctx.fillRect(0,gy,W,2);
  ctx.fillStyle='rgba(240,220,150,.28)';
  for(let i=0;i<9;i++) ctx.fillRect(i*(W/8)+12,gy+26,54,5);
  ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,gy+18); ctx.lineTo(W,gy+18); ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.lineWidth=2;
  for(let i=0;i<7;i++){ const cx0=(i*233)%W, cy0=gy+20+((i*59)%(H-gy-26));

    ctx.lineTo(cx0+30,cy0+6); ctx.lineTo(cx0+56,cy0-5); ctx.lineTo(cx0+90,cy0+8); ctx.stroke(); }
  // carteiras tombadas (nada de círculo brilhante no chão)
  function carteira(x,s){ ctx.save(); ctx.translate(x,gy-4); ctx.rotate(-0.3);
    ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(-14*s,-3*s,30*s,6*s);
    ctx.fillStyle='#7a5a2e'; ctx.fillRect(-13*s,-10*s,26*s,6*s);

  carteira(W*0.22,1); carteira(W*0.68,0.9); carteira(W*0.86,1.05);
  // postes com facho
  function poste(x){ ctx.strokeStyle='#2a2d33'; ctx.lineWidth=6;

    ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(x,gy-120); ctx.lineTo(x+18,gy-124); ctx.stroke();
    ctx.fillStyle='#3a3e45'; ctx.fillRect(x+12,gy-126,16,7);

    ctx.beginPath(); ctx.moveTo(x+20,gy-118); ctx.lineTo(x+58,gy); ctx.lineTo(x-18,gy); ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(255,205,140,.85)'; ctx.fillRect(x+14,gy-120,12,3); }

}
// ============ CENÁRIO 3: DELEGACIA DE R. POLICIA (RE2) ============
function drawDelegaciaScene(t){
  const gy=groundY();
  const ceu=ctx.createLinearGradient(0,0,0,gy);
  ceu.addColorStop(0,'#05070c'); ceu.addColorStop(0.45,'#16202c'); ceu.addColorStop(1,'#3a4a52');

  wall.addColorStop(0,'#2b3742'); wall.addColorStop(0.6,'#3d4c55'); wall.addColorStop(1,'#4e5f66');
  ctx.fillStyle=wall; ctx.fillRect(0,0,W,gy);
  ctx.fillStyle='rgba(0,0,0,.16)';
  for(let i=0;i<Math.floor(W/40);i++) ctx.fillRect(i*40,0,2,gy);
  ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.lineWidth=2;

    ctx.beginPath(); ctx.moveTo(0,ry); ctx.lineTo(W,ry); ctx.stroke(); }

    ctx.fillStyle='#1a1f26'; ctx.fillRect(lx2-32,ly2,64,10);
    const on=Math.sin(t*3+i*1.7)>-0.3;
    ctx.fillStyle=on?'rgba(255,235,180,.9)':'rgba(120,120,110,.35)';
    ctx.fillRect(lx2-28,ly2+3,56,4);
    ctx.fillStyle='rgba(255,230,170,'+(on?0.10:0.03)+')';
    ctx.beginPath(); ctx.moveTo(lx2-28,ly2+8); ctx.lineTo(lx2-70,gy); ctx.lineTo(lx2+70,gy); ctx.closePath(); ctx.fill(); }
  // apagão piscando
  if(Math.sin(t*0.9)>0.85){ ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(0,0,W,gy); }
  // mural POLICE巨大 +作案后血手印
  const px2=W*0.5, py2=gy*0.42;

  ctx.fillStyle='rgba(160,170,180,.10)'; ctx.font='bold '+Math.round(W*0.028)+'px Arial';
  ctx.fillText('R. P. D. — PRECINCT',0,W*0.035);
  ctx.restore();
  // sangue na parede + silhueta de mão
  ctx.fillStyle='rgba(110,12,12,.5)';
  ctx.beginPath(); ctx.ellipse(W*0.22,gy*0.34,52,42,0.2,0,7); ctx.fill();
  for(let i=0;i<5;i++){ ctx.beginPath();
    ctx.ellipse(W*0.22-16+i*9,gy*0.34+34-Math.abs(i-2)*5,4,10,0.2,0,7); ctx.fill(); }
  // porta dupla de vidro com fita policial
  const dW=Math.min(200,W*0.18), dH=150, dx=W*0.70-dW/2, dy=gy-dH;
  ctx.fillStyle='#0f1418'; ctx.fillRect(dx,dy,dW,dH);
  ctx.fillStyle='rgba(150,190,210,.10)'; ctx.fillRect(dx+4,dy+4,dW-8,dH-8);
  ctx.strokeStyle='#0a0d10'; ctx.lineWidth=4;
  ctx.strokeRect(dx,dy,dW,dH);
  ctx.beginPath(); ctx.moveTo(dx+dW/2,dy); ctx.lineTo(dx+dW/2,dy+dH); ctx.stroke();
  ctx.save(); ctx.translate(dx+dW/2,dy+dH*0.34); ctx.rotate(-0.28);
  ctx.fillStyle='#c8a41e'; ctx.fillRect(-dW*0.62,-9,dW*1.24,18);
  ctx.fillStyle='#1a1a1a'; ctx.font='bold 9px Arial'; ctx.textAlign='center';
  ctx.fillText('POLICE LINE',0,3.5);
  ctx.restore();
  // caixa de luz / painel electrical
  ctx.fillStyle='#2a3038'; ctx.fillRect(W*0.06,gy-90,40,54);
  ctx.strokeStyle='#454e58'; ctx.lineWidth=2; ctx.strokeRect(W*0.06,gy-90,40,54);
  ctx.fillStyle=(Math.sin(t*5)>0?'#ff5a3c':'#3a2018'); ctx.fillRect(W*0.06+6,gy-84,28,16);
  //这把推开 papers no chão
  for(let i=0;i<7;i++){ const px3=W*0.08+i*13+((i*47)%20), py3=gy-4-((i*23)%6);
    ctx.save(); ctx.translate(px3,py3); ctx.rotate(((i*37)%60)/60-0.5);
    ctx.fillStyle='rgba(200,195,180,.35)'; ctx.fillRect(-6,-4,12,8); ctx.restore(); }
  // chão de piso vitrado com reflexo
  const chao=ctx.createLinearGradient(0,gy,0,H);
  chao.addColorStop(0,'#39434c'); chao.addColorStop(0.35,'#252c33'); chao.addColorStop(1,'#0f1215');
  ctx.fillStyle=chao; ctx.fillRect(0,gy,W,H-gy);
  ctx.fillStyle='rgba(255,255,255,.06)'; ctx.fillRect(0,gy,W,2);
  ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=2;
  for(let i=0;i<=10;i++){ const lx3=i*(W/10);
    ctx.beginPath(); ctx.moveTo(lx3,gy); ctx.lineTo(lx3+(lx3-W/2)*0.18,H); ctx.stroke(); }
  for(let r=1;r<4;r++){ const ry=gy+r*((H-gy)/4);
    ctx.beginPath(); ctx.moveTo(0,ry); ctx.lineTo(W,ry); ctx.stroke(); }
  // 增加 broken glass shards (pequenos, angulares)
  ctx.fillStyle='rgba(190,220,235,.35)';
  for(let i=0;i<14;i++){ const gx2=(i*197)%W, gy2b=gy+14+((i*83)%(H-gy-20));
    ctx.beginPath(); ctx.moveTo(gx2,gy2b); ctx.lineTo(gx2+5,gy2b-4); ctx.lineTo(gx2+9,gy2b+2); ctx.closePath(); ctx.fill(); }
  // cadeira de office tombada
  ctx.save(); ctx.translate(W*0.34,gy-6); ctx.rotate(0.5);
  ctx.fillStyle='#4a3a2a'; ctx.fillRect(-16,-40,32,7); ctx.fillRect(-16,-16,32,7);
  ctx.fillStyle='#3a2c20'; ctx.fillRect(-16,-40,5,30); ctx.fillRect(11,-40,5,30);
  ctx.restore();
}

// ============ CENÁRIO 4: MANSÃO CLÁSSICA (RE1/RE7) ============
function drawMansaoScene(t){
  const gy=groundY();
  const ceu=ctx.createLinearGradient(0,0,0,gy);
  ceu.addColorStop(0,'#04060a'); ceu.addColorStop(0.5,'#1a1420'); ceu.addColorStop(1,'#4a3020');
  ctx.fillStyle=ceu; ctx.fillRect(0,0,W,gy+2);
  for(let i=0;i<30;i++){ const sx2=(i*173.3)%W, sy2=(i*89.7)%(H*0.15);
    ctx.globalAlpha=0.12+0.16*Math.abs(Math.sin(t+i)); ctx.fillStyle='#fff'; ctx.fillRect(sx2,sy2,2,2); }
  ctx.globalAlpha=1;
  // névoa esverdeada + luar
  const sx3=W*0.5, sy3=H*0.16;
  const mg2=ctx.createRadialGradient(sx3,sy3,10,sx3,sy3,180);
  mg2.addColorStop(0,'rgba(210,220,255,.4)'); mg2.addColorStop(1,'rgba(140,160,200,0)');
  ctx.fillStyle=mg2; ctx.beginPath(); ctx.arc(sx3,sy3,180,0,7); ctx.fill();
  ctx.fillStyle='#e8eeff'; ctx.beginPath(); ctx.arc(sx3,sy3,30,0,7); ctx.fill();
  // floresta morta densa
  ctx.strokeStyle='#0b0a08'; ctx.lineCap='round';
  for(let i=0;i<22;i++){ const tx3=(i*151.7)%(W+60)-30, th=70+((i*61)%90), tw=4+((i*23)%4);
    ctx.lineWidth=tw;
    ctx.beginPath(); ctx.moveTo(tx3,gy); ctx.lineTo(tx3+((i%3)-1)*6,gy-th); ctx.stroke();
    ctx.lineWidth=tw*0.5;
    ctx.beginPath(); ctx.moveTo(tx3,gy-th*0.6); ctx.lineTo(tx3-16,gy-th*0.85); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(tx3,gy-th*0.7); ctx.lineTo(tx3+18,gy-th*0.92); ctx.stroke(); }
  // neblina baixa
  for(let i=0;i<3;i++){ const fy2=gy-20+i*18;
    const fg=ctx.createLinearGradient(0,fy2-14,0,fy2+14);
    fg.addColorStop(0,'rgba(120,140,120,0)'); fg.addColorStop(0.5,'rgba(120,140,120,.16)'); fg.addColorStop(1,'rgba(120,140,120,0)');
    ctx.fillStyle=fg; ctx.fillRect(0,fy2-14,W,28); }
  // mansão: pedra cinza, janelas góticas, torre
  const mX=W*0.14, mW=Math.min(560,W*0.62), mH=Math.min(250,gy*0.66), mY=gy-mH;
  ctx.fillStyle='rgba(0,0,0,.5)'; ctx.beginPath(); ctx.ellipse(mX+mW/2,gy+5,mW*0.55,12,0,0,7); ctx.fill();
  const mgd=ctx.createLinearGradient(0,mY,0,gy);
  mgd.addColorStop(0,'#6a6a72'); mgd.addColorStop(0.5,'#4c4c55'); mgd.addColorStop(1,'#33333a');
  ctx.fillStyle=mgd; ctx.fillRect(mX,mY,mW,mH);
  // blocos de pedra
  ctx.strokeStyle='rgba(0,0,0,.28)'; ctx.lineWidth=1.5;
  for(let ry=mY;ry<gy;ry+=18){ ctx.beginPath(); ctx.moveTo(mX,ry); ctx.lineTo(mX+mW,ry); ctx.stroke();
    const off=((ry/18)%2)*20;
    for(let bx2=mX+off;bx2<mX+mW;bx2+=40){ ctx.beginPath(); ctx.moveTo(bx2,ry); ctx.lineTo(bx2,ry+18); ctx.stroke(); } }
  // telhados de ardósia
  ctx.fillStyle='#2a2a32';
  ctx.beginPath(); ctx.moveTo(mX-24,mY); ctx.lineTo(mX+mW*0.3,mY-56); ctx.lineTo(mX+mW*0.55,mY);
  ctx.lineTo(mX+mW*0.7,mY-40); ctx.lineTo(mX+mW+24,mY); ctx.closePath(); ctx.fill();
  // torre principal
  const tX2=mX+mW*0.62, tW=mW*0.24, tH=mH*1.35, tY=gy-tH;
  ctx.fillStyle=mgd; ctx.fillRect(tX2,tY,tW,tH+ (mY>gy?0:0));
  ctx.fillStyle='#232329';
  ctx.beginPath(); ctx.moveTo(tX2-20,tY); ctx.lineTo(tX2+tW/2,tY-72); ctx.lineTo(tX2+tW+20,tY); ctx.closePath(); ctx.fill();
  // vigia com sino
  ctx.fillStyle='#1a1a20'; ctx.fillRect(tX2+tW*0.3,tY-72-26,tW*0.4,26);
  ctx.fillStyle='#c9a227'; ctx.beginPath(); ctx.arc(tX2+tW*0.5,tY-72-32,7,0,7); ctx.fill();
  // janelas góticas em arco (some acesas)
  function gothicWin(wx2,wy2,ww,wh,lit){
    ctx.fillStyle='#0a0a10';
    ctx.beginPath();
    ctx.moveTo(wx2,wy2+wh); ctx.lineTo(wx2,wy2+ww/2);
    ctx.quadraticCurveTo(wx2+ww/2,wy2-ww*0.5,wx2+ww,wy2+ww/2);
    ctx.lineTo(wx2+ww,wy2+wh); ctx.closePath(); ctx.fill();
    if(lit){ ctx.fillStyle='rgba(255,170,80,.5)';
      ctx.beginPath();
      ctx.moveTo(wx2+2,wy2+wh-2); ctx.lineTo(wx2+2,wy2+ww/2);
      ctx.quadraticCurveTo(wx2+ww/2,wy2-ww*0.4,wx2+ww-2,wy2+ww/2);
      ctx.lineTo(wx2+ww-2,wy2+wh-2); ctx.closePath(); ctx.fill(); }
    ctx.strokeStyle='#8a8a92'; ctx.lineWidth=2; ctx.beginPath();
    ctx.moveTo(wx2+ww/2,wy2-ww*0.3); ctx.lineTo(wx2+ww/2,wy2+wh); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(wx2,wy2+ww*0.9); ctx.lineTo(wx2+ww,wy2+ww*0.9); ctx.stroke(); }
  for(let i=0;i<5;i++) gothicWin(mX+mW*(0.06+i*0.14), mY+34, mW*0.09, mH*0.34, ((i*41)%3)!==0);
  gothicWin(tX2+tW*0.28, tY+40, tW*0.44, mH*0.3, false);
  // porta dupla de carvalho com arcos
  const drX=mX+mW*0.10, drW=mW*0.16, drH=Math.min(110,mH*0.5), drY=gy-drH;
  ctx.fillStyle='#3a2510'; ctx.fillRect(drX-6,drY-6,drW+12,drH+6);
  ctx.fillStyle='#4a2f14'; ctx.fillRect(drX,drY,drW,drH);
  ctx.strokeStyle='#2a1a0a'; ctx.lineWidth=3;
  for(let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(drX+i*drW/4,drY); ctx.lineTo(drX+i*drW/4,drY+drH); ctx.stroke(); }
  ctx.beginPath(); ctx.arc(drX+drW/2,drY+drH*0.5,Math.min(drW,drH)*0.42,Math.PI,0); ctx.stroke();
  ctx.fillStyle='#c9a227'; ctx.beginPath(); ctx.arc(drX+drW*0.42,drY+drH*0.55,3,0,7); ctx.fill();
  // 网络 guillotine? no. lampadas de aceite
  function candle(cx2,cy2){ ctx.fillStyle='#d8d2c4'; ctx.fillRect(cx2-3,cy2,6,14);
    const fl2=0.6+Math.sin(t*8+cx2)*0.3;
    ctx.fillStyle='rgba(255,190,80,.9)';
    ctx.beginPath(); ctx.ellipse(cx2,cy2-3*fl2,2.5,4*fl2,0,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,180,70,.12)';
    ctx.beginPath(); ctx.arc(cx2,cy2-4,16,0,7); ctx.fill(); }
  candle(W*0.10,gy-16); candle(W*0.92,gy-16);
  // chão de pedra com tapete
  const chao=ctx.createLinearGradient(0,gy,0,H);
  chao.addColorStop(0,'#3a3830'); chao.addColorStop(0.35,'#26241e'); chao.addColorStop(1,'#0d0c0a');
  ctx.fillStyle=chao; ctx.fillRect(0,gy,W,H-gy);
  ctx.fillStyle='rgba(255,220,160,.08)'; ctx.fillRect(0,gy,W,2);
  ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=2;
  for(let r=0;r<3;r++){ const ry=gy+18+r*((H-gy-18)/3);
    ctx.beginPath(); ctx.moveTo(0,ry);
    for(let x=0;x<=W;x+=70)ctx.lineTo(x,ry+Math.sin(x*0.02)*4); ctx.stroke(); }
  // tapete vermelho sangrado
  ctx.fillStyle='rgba(90,16,16,.75)';
  ctx.beginPath(); ctx.ellipse(W*0.5,gy+40,Math.min(220,W*0.3),26,0,0,7); ctx.fill();
  ctx.fillStyle='rgba(120,26,22,.8)';
  ctx.beginPath(); ctx.ellipse(W*0.5,gy+40,Math.min(180,W*0.24),20,0,0,7); ctx.fill();
  // 又 ladron cavalo basculante
  ctx.save(); ctx.translate(W*0.24,gy-4); ctx.rotate(-0.35);
  ctx.fillStyle='#3a2c1c'; ctx.fillRect(-22,-46,44,8); ctx.fillRect(-22,-24,44,8);
  ctx.fillStyle='#2a2014'; ctx.fillRect(-22,-46,6,28); ctx.fillRect(16,-46,6,28);
  ctx.restore();
}

// ============ CENÁRIO 5: LABORATÓRIO ABANDONADO (laboratório) ============
function drawLabScene(t){
  const gy=groundY();
  const ceu=ctx.createLinearGradient(0,0,0,gy);
  ceu.addColorStop(0,'#03080a'); ceu.addColorStop(0.5,'#0c2226'); ceu.addColorStop(1,'#1e4a44');
  ctx.fillStyle=ceu; ctx.fillRect(0,0,W,gy+2);
  // Pipes e Pretty na parede
  ctx.strokeStyle='#243c3a'; ctx.lineWidth=8; ctx.lineCap='round';
  for(let i=0;i<4;i++){ const py2=H*0.1+i*30;
    ctx.beginPath(); ctx.moveTo(0,py2);
    ctx.bezierCurveTo(W*0.3,py2-20,W*0.6,py2+20,W,py2-6); ctx.stroke(); }
  ctx.strokeStyle='#3d5c58'; ctx.lineWidth=3;
  for(let i=0;i<4;i++){ const py2=H*0.1+i*30;
    ctx.beginPath(); ctx.moveTo(0,py2-2);
    ctx.bezierCurveTo(W*0.3,py2-22,W*0.6,py2+18,W,py2-8); ctx.stroke(); }
  // green liquid glowing tanks
  for(let i=0;i<4;i++){ const tx2=W*(0.12+i*0.24), tW=Math.min(90,W*0.09), tH=Math.min(180,gy*0.5);
    const ty2=gy-tH;
    ctx.fillStyle='#0a1416'; ctx.fillRect(tx2-6,ty2-8,tW+12,tH+8);
    const lg=ctx.createLinearGradient(0,ty2,0,gy);
    lg.addColorStop(0,'rgba(60,220,150,.75)'); lg.addColorStop(1,'rgba(10,80,60,.9)');
    ctx.fillStyle=lg; ctx.fillRect(tx2,ty2,tW,tH);
    // bolhas subindo
    for(let b=0;b<4;b++){ const bpy=ty2+((t*40+b*37+ (i*13))%tH);
      ctx.fillStyle='rgba(180,255,220,.5)';
      ctx.beginPath(); ctx.arc(tx2+8+((b*29)%(tW-16)),bpy,2+(b%2),0,7); ctx.fill(); }
    ctx.fillStyle='#48e0a0'; ctx.fillRect(tx2-6,ty2-8,tW+12,8);
    ctx.fillStyle='rgba(120,255,200,.18)';

// paleta do uniforme/herói ativo
// escurece/clareia uma cor hex
function shade(hex,amt){
  const h2=hex.replace('#','');
  let r=parseInt(h2.substring(0,2),16), g=parseInt(h2.substring(2,4),16), b=parseInt(h2.substring(4,6),16);
  if(amt<0){ r*=(1+amt); g*=(1+amt); b*=(1+amt); }
  else { r+=(255-r)*amt; g+=(255-g)*amt; b+=(255-b)*amt; }
  return 'rgb('+Math.round(r)+','+Math.round(g)+','+Math.round(b)+')';
}
function uniCores(){
  const h=HEROIS[player.hero]||HEROIS.leon;
  const u=(player.hero==='leon') ? player.unif : null;
  const c=h.cores;
  return {
    camisa:  u ? u.camisa   : c.camisa,
    camisa2: u ? u.camisa2  : c.camisa2,
    colete:  u ? u.colete   : c.colete,
    calca:   u ? u.calca    : c.calca,
    calca2:  u ? u.calca2   : c.calca2,
    pele:    c.pele,
    cabelo:  c.cabelo,
    texto:   u ? u.texto    : c.texto,
    cracha:  c.crachá,
    full:    h.full, nome:h.nome,
  };
}

    if(isBoss){ // coroa/chifres do boss
      ctx.fillStyle='#1a0d0d';
      ctx.beginPath(); ctx.moveTo(-6,-h-2); ctx.lineTo(-2,-h-12); ctx.lineTo(2,-h-2); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(4,-h-2); ctx.lineTo(8,-h-12); ctx.lineTo(12,-h-2); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    if(z.hp<z.maxHp&&z.tipo!=='boss'){
      ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(z.x-20,z.y-h-14,40,5);
      ctx.fillStyle='#ff5b5b'; ctx.fillRect(z.x-19,z.y-h-13,38*(z.hp/z.maxHp),3);
    }
  }
}
function draw(){
  const t=elapsed;
  drawBackground(t);
  for(const b of bullets){ ctx.fillStyle='#ffe27a'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r+2,0,7); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill(); }
  for(const p of parts){ ctx.globalAlpha=Math.max(0,p.life/p.max); ctx.fillStyle=p.cor;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); }
  ctx.globalAlpha=1;
  if(player&&state!=='menu'){ drawZombies(t); drawPlayer(t); }
  if(state==='playing'||state==='phaseclear'){
    ctx.strokeStyle='#ffcf6e'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(mouse.x,mouse.y,12,0,7); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(mouse.x-18,mouse.y); ctx.lineTo(mouse.x-7,mouse.y);
    ctx.moveTo(mouse.x+7,mouse.y); ctx.lineTo(mouse.x+18,mouse.y);
    ctx.moveTo(mouse.x,mouse.y-18); ctx.lineTo(mouse.x,mouse.y-7);
    ctx.moveTo(mouse.x,mouse.y+7); ctx.lineTo(mouse.x,mouse.y+18); ctx.stroke();
    if(player&&player.weapon!=='knife'){ const s=shoulderPos();
      ctx.strokeStyle='rgba(255,210,110,.25)'; ctx.lineWidth=1; ctx.setLineDash([6,6]);
      ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(mouse.x,mouse.y); ctx.stroke(); ctx.setLineDash([]); }
  }
}
let last=performance.now();
function loop(now){ const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(state==='playing'||state==='phaseclear')update(dt); else elapsed+=dt;
  draw(); requestAnimationFrame(loop); }

window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase(); keys[k]=true;
  if(k==='f')knife();
  if(k==='m')toggleMusic();
  if(k==='1')selectGun('pistol');
  if(k==='2')selectGun('shotgun');
  if(k==='3')selectGun('smg');
  if(k==='q')cycleGun();
  if(k==='r'&&(state==='gameover'||state==='victory'))startGame();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
});
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
canvas.addEventListener('mousemove',e=>{ mouse.x=e.clientX; mouse.y=e.clientY; });
canvas.addEventListener('mousedown',e=>{ if(e.button===0)mouse.down=true; if(e.button===2)knife(); });
window.addEventListener('mouseup',e=>{ if(e.button===0)mouse.down=false; });
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('touchmove',e=>{ const t=e.touches[0]; mouse.x=t.clientX; mouse.y=t.clientY; },{passive:true});
canvas.addEventListener('touchstart',e=>{ const t=e.touches[0]; mouse.x=t.clientX; mouse.y=t.clientY; mouse.down=true; },{passive:true});
canvas.addEventListener('touchend',()=>mouse.down=false);

// init
resetPlayer(); bullets=[]; zombies=[]; parts=[]; embers=[];
for(let i=0;i<70;i++)embers.push({x:Math.random()*W,y:Math.random()*H,s:1+Math.random()*2.5,v:12+Math.random()*30,o:Math.random()*7});
showMenu(); updateHUD(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
